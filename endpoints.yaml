# NSE endpoint registry.  All entries below verified live on 2026-08-29.
#
# `generation` selects the transport adapter in bbnse/core/session.py:
#   legacy  -> /api/<name>       original JSON API, still the majority
#   nextapi -> /api/NextApi/...  new Next.js gateway; NSE is mid-migration
#   archive -> nsearchives.nseindia.com file downloads (CSV/zip)
#
# NSE migrates pages between generations without notice. Re-verify with:
#   python main.py verify-endpoints
version: 1

defaults:
  host: https://www.nseindia.com
  timeout: 25

endpoints:

  # ---------- WIRED UP (proof-of-concept trio) ----------
  gainers:
    generation: legacy
    path: /api/live-analysis-variations
    params: {index: gainers}
    referer: /market-data/top-gainers-losers
    # Response is keyed by index bucket, not a flat list.
    buckets: [NIFTY, BANKNIFTY, NIFTYNEXT50, FOSec, allSec]
    row_root: "{bucket}.data"
    verified: {date: 2026-08-29, status: 200, bytes: 36211}

  losers:
    generation: legacy
    path: /api/live-analysis-variations
    params: {index: loosers}       # NSE spells it "loosers". Not a typo here.
    referer: /market-data/top-gainers-losers
    buckets: [NIFTY, BANKNIFTY, NIFTYNEXT50, FOSec, allSec]
    row_root: "{bucket}.data"
    verified: {date: 2026-08-29, status: 200, bytes: 36504}

  week52_high:
    generation: legacy
    path: /api/live-analysis-data-52weekhighstock
    referer: /market-data/52-week-high-equity-market
    row_root: data
    verified: {date: 2026-08-29, status: 200, rows: 132}

  week52_low:
    generation: legacy
    path: /api/live-analysis-data-52weeklowstock
    referer: /market-data/52-week-high-equity-market
    row_root: data
    verified: {date: 2026-08-29, status: 200, rows: 84}

  large_deals:
    generation: legacy
    path: /api/snapshot-capital-market-largedeal
    referer: /market-data/large-deals
    row_root: BULK_DEALS_DATA
    extra_roots: [BLOCK_DEALS_DATA, SHORT_DEALS_DATA]
    verified: {date: 2026-08-29, status: 200, bulk_rows: 191}

  # ---------- VERIFIED, NOT YET WIRED (phase 2) ----------
  volume_spurts:
    generation: legacy
    path: /api/live-analysis-volume-gainers
    referer: /market-data/volume-gainers-spurts
    row_root: data
    verified: {date: 2026-08-29, status: 200, rows: 25}

  oi_spurts:
    generation: legacy
    path: /api/live-analysis-oi-spurts-underlyings
    referer: /market-data/oi-spurts
    row_root: data
    verified: {date: 2026-08-29, status: 200, rows: 216}

  price_band_hitters:
    generation: legacy
    path: /api/live-analysis-price-band-hitter
    referer: /market-data/upper-band-hitters
    row_root: upper.AllSec.data
    verified: {date: 2026-08-29, status: 200, bytes: 99697}

  advance_decline:
    generation: legacy
    path: /api/live-analysis-advance
    referer: /market-data/advance
    row_root: advance
    verified: {date: 2026-08-29, status: 200, bytes: 524987}

  most_active_value:
    generation: legacy
    path: /api/live-analysis-most-active-securities
    params: {index: value}
    referer: /market-data/most-active-equities
    row_root: data
    verified: {date: 2026-08-29, status: 200, rows: 20}

  indices_all:
    generation: legacy
    path: /api/allIndices
    referer: /market-data/live-market-indices
    row_root: data
    verified: {date: 2026-08-29, status: 200, rows: 139}

  pre_open_cm:
    generation: legacy
    path: /api/market-data-pre-open
    params: {key: ALL}
    referer: /market-data/pre-open-market-cm-and-emerge-market
    row_root: data
    # 2 MB payload. Snapshot dedup matters here; see storage.raw_retention.
    verified: {date: 2026-08-29, status: 200, rows: 2072, bytes: 2069128}

  pre_open_fo:
    generation: legacy
    path: /api/market-data-pre-open
    params: {key: FO}
    referer: /market-data/pre-open-market-fno
    row_root: data
    verified: {date: 2026-08-29, status: 200, bytes: 214917}

  new_listings:
    generation: legacy
    path: /api/new-listing-today
    referer: /market-data/new-stock-exchange-listings-today
    row_root: data
    verified: {date: 2026-08-29, status: 200, note: "empty on non-trading days"}

  etf:
    generation: legacy
    path: /api/etf
    referer: /market-data/exchange-traded-funds-etf
    row_root: data
    verified: {date: 2026-08-29, status: 200, rows: 349}

  most_active_contracts:
    generation: legacy
    path: /api/snapshot-derivatives-equity
    params: {index: contracts, limit: 20}
    referer: /market-data/most-active-contracts
    row_root: volume.data
    verified: {date: 2026-08-29, status: 200, bytes: 15333}

  derivatives_watch:
    generation: legacy
    path: /api/liveEquity-derivatives
    params: {index: nse50_fut}
    referer: /market-data/equity-derivatives-watch
